packages:
  - packages/*

blockExoticSubdeps: false

overrides:
  # Keep ViteHub auth and the app on one Better Auth type surface.
  better-auth: 1.7.14
  # @better-auth/oauth-provider pins utils 0.4.2 while better-auth pins 0.5.1, which splits @better-auth/core in two.
  "@better-auth/utils": 0.5.1
  # Nuxt and Nuxt UI must share one Vue instance.
  vue: 3.5.44
  devalue: ^5.9.4

patchedDependencies:
  # Logs the error behind a JSON-RPC "Internal error" (upstream returns it without a trace), and puts the description,
  # icons, and website in modern serverInfo as legacy initialize does. Rebase or drop it when the okmcp pin moves.
  okmcp@0.2.1-main.2239349: patches/okmcp@0.2.1-main.2239349.patch
  # Lets Workers builds resolve pkce-challenge (workerd and default targets), which the MCP SDK in vite-hub imports.
  # Upstream: https://github.com/crouchcd/pkce-challenge/pull/50, merged, unreleased. Drop it when a release has it.
  pkce-challenge@5.0.1: patches/pkce-challenge@5.0.1.patch

# Only workerd (local Workers runtime) and the SQLite driver need their install scripts.
allowBuilds:
  "@mongodb-js/zstd": false
  "@parcel/watcher": false
  "@swc/core": false
  cbor-extract: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  node-liblzma: false
  sharp: false
  ssh2: false
  unrs-resolver: false
  vue-demi: false
  workerd: true

minimumReleaseAgeExclude:
  - wrangler@4.156.0
  - "@better-auth/*"
  - better-auth@1.7.14
  - comark-annotate@0.7.6
