  "@vite-hub/channels": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/channels@df62e6d
  "@vite-hub/choices": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/choices@df62e6d
  "@vite-hub/cli": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/cli@df62e6d
  "@vite-hub/cms": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/cms@df62e6d
  "@vite-hub/codemods": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/codemods@df62e6d
  "@vite-hub/comments": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/comments@df62e6d
  "@vite-hub/connections": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/connections@df62e6d
  "@vite-hub/content": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/content@df62e6d
  "@vite-hub/database": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/database@df62e6d
  "@vite-hub/device": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/device@df62e6d
  "@vite-hub/docs": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/docs@df62e6d
  "@vite-hub/email": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/email@df62e6d
  "@vite-hub/env": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/env@df62e6d
  "@vite-hub/forge": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/forge@df62e6d
  "@vite-hub/forms": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/forms@df62e6d
  "@vite-hub/gateways": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/gateways@df62e6d
  "@vite-hub/i18n": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/i18n@df62e6d
  "@vite-hub/kit": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/kit@df62e6d
  "@vite-hub/kv": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/kv@df62e6d
  "@vite-hub/markdown-template": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/markdown-template@df62e6d
  "@vite-hub/mcp": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/mcp@df62e6d
  "@vite-hub/presets": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/presets@df62e6d
  "@vite-hub/queue": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/queue@df62e6d
  "@vite-hub/rate-limit": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/rate-limit@df62e6d
  "@vite-hub/realtime": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/realtime@df62e6d
  "@vite-hub/runtime": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/runtime@df62e6d
  "@vite-hub/sandbox": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/sandbox@df62e6d
  "@vite-hub/schedule": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/schedule@df62e6d
  "@vite-hub/shell": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/shell@df62e6d
  "@vite-hub/source": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/source@df62e6d
  "@vite-hub/sync": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/sync@df62e6d
  "@vite-hub/ui": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/ui@df62e6d
  "@vite-hub/web-container": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/web-container@df62e6d
  "@vite-hub/webhooks": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/webhooks@df62e6d
  "@vite-hub/workflow": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/workflow@df62e6d
  "@vite-hub/workspace": https://pkg.pr.new/vite-hub/vitehub/@vite-hub/workspace@df62e6d
  # Keep ViteHub auth and the app on one Better Auth type surface.
  better-auth: 1.7.15
  # @better-auth/oauth-provider pins utils 0.4.2 while better-auth pins 0.5.1, which splits @better-auth/core in two.
  "@better-auth/utils": 0.5.1
  # Nuxt and Nuxt UI must share one Vue instance.
  vue: 3.5.44
  devalue: ^5.9.4
  # comark-content and comark-ui render with the app's Comark.
  comark: 0.9.0

# Only workerd (local Workers runtime) and the SQLite driver need their install scripts.
allowBuilds:
  "@mongodb-js/zstd": false
  "@parcel/watcher": false
  "@swc/core": false
  cbor-extract: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  node-liblzma: false
  sharp: false
  ssh2: false
  unrs-resolver: false
  vue-demi: false
  workerd: true

minimumReleaseAgeExclude:
  - wrangler@4.156.0
  - "@better-auth/*"
  - better-auth@1.7.14
  - comark-annotate@0.7.6
