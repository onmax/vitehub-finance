packages:
  - packages/*

blockExoticSubdeps: false

overrides:
  # Keep ViteHub auth and the app on one Better Auth type surface.
  better-auth: 1.7.10
  # Nuxt and Nuxt UI must share one Vue instance.
  vue: 3.5.44
  devalue: ^5.9.4

patchedDependencies:
  # Jev through TypeSafe, Vercel AI Gateway, or Cloudflare AI Gateway: `typesafeEnv({ provider: "cloudflare" })` and the
  # `jev()` client in vite-hub/agent/gateways. Upstream: PR_LINK. Drop both when the vite-hub pin includes it.
  '@vite-hub/agent@0.0.4': patches/@vite-hub__agent@0.0.4.patch
  '@vite-hub/env@0.0.4': patches/@vite-hub__env@0.0.4.patch
  # Logs the error behind a JSON-RPC "Internal error"; upstream returns it without a trace.
  h3-mcp@0.2.0: patches/h3-mcp@0.2.0.patch
  # `nuxt dev` on the nightly CLI gives Vite no httpServer, and virtual modules resolve bare imports from the root.
  nitro@3.0.260610-beta: patches/nitro@3.0.260610-beta.patch
  # Keeps Nuxt's dev-only module URL out of the Workers bundle.
  nuxt-nightly@5.0.0-29766097.1e475df9: patches/nuxt-nightly@5.0.0-29766097.1e475df9.patch

# Only workerd (local Workers runtime) and the SQLite driver need their install scripts.
allowBuilds:
  "@mongodb-js/zstd": false
  "@parcel/watcher": false
  "@swc/core": false
  cbor-extract: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  node-liblzma: false
  sharp: false
  ssh2: false
  unrs-resolver: false
  vue-demi: false
  workerd: true

minimumReleaseAgeExclude:
  - nitro-mcp-toolkit@0.4.0
  - wrangler@4.148.0
  - "@better-auth/*"
  - better-auth@1.7.10
